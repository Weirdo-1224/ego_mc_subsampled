<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GX010021 · Benchmark 任务审核工作台 v2</title>
<style>
:root{
  --bg:#f2f5f6; --panel:#ffffff; --ink:#1c2b32; --muted:#5d7079; --faint:#8aa0a8;
  --line:#d9e1e4; --accent:#0d625e; --accent-soft:#e3f1ed; --warn:#a85b07; --warn-soft:#fdf2e3;
  --danger:#b3261e; --danger-soft:#fdecea; --ok:#1e6b3a; --ok-soft:#e6f3ea;
  --radius:10px; --shadow:0 1px 2px rgba(20,40,45,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #b3c4c8;background:#fff;color:var(--accent);border-radius:7px;padding:6px 12px;font-weight:600}
button:hover{background:var(--accent-soft)}
button:disabled{cursor:not-allowed;color:var(--faint);border-color:var(--line);background:#f6f8f9}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0a504d}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
input[type=text],input[type=number],select,textarea{border:1px solid #b3c4c8;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:74px;resize:vertical}
label.field{display:block;margin:0 0 12px}
label.field>span{display:block;font-weight:650;font-size:13px;margin-bottom:4px}
label.field>small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
h1,h2,h3{margin:0}
.muted{color:var(--muted)} .small{font-size:12px}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#123b41;color:#fff;flex:none}
header h1{font-size:17px;font-weight:700;white-space:nowrap}
header .meta{font-size:12px;color:#bcd2d4;white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em}
.chip.warn{background:#fff0cc;color:#6b4a00}
#hdrRight{margin-left:auto;display:flex;align-items:center;gap:10px}
#hdrRight label{display:flex;align-items:center;gap:6px;font-size:12px;color:#bcd2d4;white-space:nowrap}
#hdrRight input{width:130px;padding:5px 8px;background:#0d2f34;border:1px solid #2a545a;color:#fff;border-radius:6px}
#hdrRight button{background:transparent;border:1px solid #3a6a70;color:#dff0f1}
#hdrRight button:hover{background:#1a4a52}
#progress{font-variant-numeric:tabular-nums;font-weight:700;background:#0d2f34;border:1px solid #2a545a;border-radius:20px;padding:3px 12px;font-size:12px;white-space:nowrap}
/* ---------- main layout ---------- */
.main{flex:1;display:grid;grid-template-columns:336px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);background:#eef3f4;display:flex;flex-direction:column;min-height:0}
.filters{padding:10px 12px 6px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line)}
.filters input{grid-column:1/-1}
#taskList{flex:1;overflow-y:auto;padding:10px 12px}
.taskCard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.taskCard:hover{border-color:var(--accent)}
.taskCard.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.taskCard .row1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.taskCard .q{font-size:13px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.taskCard .row3{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px}
.tk{border-radius:5px;padding:0 6px;font-weight:800;font-size:11px}
.tk.T1{background:#e3edfb;color:#1c4e9d}.tk.T2{background:#efe6fb;color:#5b34a8}.tk.T3{background:#e0f3ec;color:#0d625e}
.st{font-weight:700}
.st.todo{color:var(--faint)}.st.doing{color:var(--warn)}.st.done{color:var(--ok)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:#d3dde0}
.dots i.on{background:var(--accent)}
#sideFoot{padding:8px 12px;border-top:1px solid var(--line);font-size:12px}
#sideFoot a{color:var(--accent);text-decoration:none}
/* ---------- workspace ---------- */
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}
.stepbar{display:flex;align-items:center;gap:6px;padding:10px 18px 0;background:var(--bg);flex:none}
.stepbar .sp{flex:none;color:var(--faint)}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 14px 6px 8px;font-weight:650;color:var(--muted)}
.step .n{width:22px;height:22px;border-radius:50%;background:#e4ebec;color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.step.active{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow)}
.step.active .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.step.locked-step .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{opacity:.55}
.auxTabs{margin-left:auto;display:flex;gap:4px}
.auxTabs button{border:none;background:transparent;color:var(--muted);padding:5px 9px;border-radius:7px;font-weight:600}
.auxTabs button.active{background:#fff;color:var(--accent);border:1px solid var(--line)}
.wcontent{flex:1;overflow-y:auto;padding:14px 18px 24px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.panelTitle{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
/* ---------- step 1 ---------- */
.qcard{border-left:4px solid var(--accent)}
.qcard .qtext{font-size:17px;font-weight:700;margin:4px 0 6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.videoPane{position:sticky;top:0}
video{width:100%;background:#0e181d;border-radius:8px;display:block;max-height:46vh}
.vctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.vctl select{width:auto}
.vctl .clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:96px;text-align:right}
.vmsg{margin-top:6px;font-size:12px;border-radius:7px;padding:6px 10px;display:none}
.vmsg.err{display:block;background:var(--danger-soft);color:var(--danger)}
.vmsg.warn{display:block;background:var(--warn-soft);color:var(--warn)}
.vmsg.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.blindNote{background:var(--accent-soft);border:1px solid #bfe0d6;color:#0a4a44;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.lockInfo{font-size:12px;color:var(--muted);margin-top:8px}
.lockedBanner{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe0c8;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- step 2 ---------- */
.evGrid{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.evList{max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.evItem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px}
.evItem:hover{border-color:var(--accent)}
.evItem.active{border-color:var(--accent);background:var(--accent-soft)}
.evItem .t{font-weight:700;display:block;margin-bottom:1px}
.src{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;letter-spacing:.04em;vertical-align:1px}
.src.VIDEO{background:#dbe9f6;color:#1c4e9d}
.src.ANNOTATION_TEXT{background:#f6ecd4;color:#7a5a0d}
.src.AI_CANDIDATE{background:#e2d9f5;color:#5b34a8}
.evPane .evHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.quoteCard{border-left:3px solid #c99b3b;background:#fffaf0;border-radius:0 8px 8px 0;padding:10px 12px;margin:8px 0}
.quoteCard .q{font-size:14.5px;font-style:normal;margin:2px 0}
.frameStrip{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.frameStrip figure{margin:0;flex:none;text-align:center}
.frameStrip img{width:170px;border-radius:5px;display:block}
/* ---------- step 3 ---------- */
.formGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 16px}
.formGrid .full{grid-column:1/-1}
.rangeRow{display:flex;gap:8px;align-items:center}
.rangeRow input{width:110px}
.t2block{border:1px solid #e4c9a0;background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.t2block h3{color:var(--warn);font-size:14px;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);background:#eef3f4;border-radius:7px;padding:7px 10px;margin-bottom:12px}
.decRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#saveState{font-size:12px;color:var(--muted)}
#saveState.err{color:var(--danger)}
/* ---------- aux ---------- */
.auxPanel .row{padding:10px 0;border-bottom:1px solid var(--line)}
.auxPanel .row:last-child{border-bottom:0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f6f9fa;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}
a{color:var(--accent)}
@media(max-width:1000px){.main{grid-template-columns:1fr}aside{display:none}.grid2{grid-template-columns:1fr}.evGrid{grid-template-columns:1fr}.videoPane{position:static}}</style>
</head>
<body>
<header>
  <h1>GX010021 · 任务审核工作台 v2</h1>
  <span class="chip warn">CANDIDATE / PENDING · 无 Gold</span>
  <span class="meta">696.930s · 无音轨 · 9 条候选任务 · 审核结果为待审草稿，不生成 Gold</span>
  <div id="hdrRight">
    <span id="progress">已审 0 / 9</span>
    <label>审核者 <input id="reviewer" type="text" placeholder="统一署名，仅需填写一次" autocomplete="off"></label>
    <button id="exportBtn" title="导出结构化审核 JSON">导出 JSON</button>
    <button id="importBtn" title="导入此前导出的审核 JSON（含旧版草稿）">导入 JSON</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<div class="main">
<aside>
  <div class="filters">
    <select id="track"><option>全部 Track</option><option>T1</option><option>T2</option><option>T3</option></select>
    <select id="statusFilter"><option>全部状态</option><option>未审</option><option>进行中</option><option>已审</option></select>
    <input id="search" type="text" placeholder="检索题面，如：鸡蛋 / 烤模 / 规则">
  </div>
  <div id="taskList"></div>
  <div id="sideFoot">
    <a href="index.html">旧版数据展示页</a> · <a href="review_data.json">候选与来源 JSON</a> · <a href="README.md">方法说明</a><br>
    <span id="migrateInfo" class="muted"></span>
  </div>
</aside>
<div class="workspace">
  <div class="stepbar">
    <button class="step" id="stepBtn1"><span class="n">1</span>当前窗口独立判断</button><span class="sp">→</span>
    <button class="step" id="stepBtn2" disabled><span class="n">2</span>历史证据核验</button><span class="sp">→</span>
    <button class="step" id="stepBtn3" disabled><span class="n">3</span>结构化审核结论</button>
    <div class="auxTabs">
      <button data-aux="review" class="active">审核</button>
      <button data-aux="timeline">完整时间线</button>
      <button data-aux="annotations">原始标注 55</button>
      <button data-aux="json">JSON 详情</button>
    </div>
  </div>
  <div class="wcontent" id="wcontent"></div>
</div>
</div>

<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
/* ================= data ================= */
const D=JSON.parse(document.getElementById('data').textContent);
const E=new Map(D.evidence.map(x=>[x.id,x]));
const TL=new Map(D.timeline.map(x=>[x.evidence_ref,x]));
const keyOf=ref=>ref.split(':').pop();
const TASK_CLIP=t=>`clips/${keyOf(t.current_evidence.find(r=>r.endsWith('_current'))||t.id)}.mp4`;
const $=id=>document.getElementById(id);
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function fmtT(t){return (Math.round(t*1000)/1000).toFixed(3).replace(/\.?0+$/,'')+'s'}

/* ================= store ================= */
const V2_KEY='GX010021_phase1_20261027_review_v2';
const LEGACY_KEY='GX010021_phase1_20261027_PENDING_drafts';
function emptyRec(){return{
  step1:{answer:'',sufficient:'',note:'',locked:false,locked_at:null},
  step2:{note:'',history_checked:false},
  step3:{visual_fact:'',answer_text:'',certainty:'',window_sufficient:'',history_dependency:'',
         alt_evidence:'',decision:'',notes:'',fix_start:'',fix_end:'',
         t2_rule_source:'',t2_rule_validity:'',t2_rule_note:''},
  saved_at:null}}
let store;
try{store=JSON.parse(localStorage.getItem(V2_KEY)||'null')}catch(e){store=null}
if(!store||store.format_version!==2||!store.tasks){store={format_version:2,episode:D.episode,reviewer:'',tasks:{},updated_at:null}}
const rec=t=>store.tasks[t.id]||(store.tasks[t.id]=emptyRec());
function hasContent(r){return r.step1.answer||r.step1.locked||r.step2.note||r.step3.decision||r.step3.notes}
function taskStatus(t){const r=store.tasks[t.id];if(!r||!hasContent(r))return['未审','todo'];if(r.step3.decision)return['已审','done'];return['进行中','doing']}

/* ---- legacy draft migration (read-only, never deletes) ---- */
(function migrate(){
  let legacy=null;try{legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null')}catch(e){}
  if(!legacy)return;const src=legacy.drafts||legacy;let n=0;
  for(const t of D.tasks){const old=src[t.id];if(!old)continue;const r=rec(t);
    if(!r.step3.notes&&old.notes){r.step3.notes='[旧版草稿迁移] '+old.notes;n++}
    if(!store.reviewer&&old.reviewer)store.reviewer=old.reviewer;}
  if(n){$('migrateInfo').textContent=`已从旧版草稿迁移 ${n} 条备注（原草稿保留未删）。`;save(true);}
  else if(Object.keys(src).length){$('migrateInfo').textContent='检测到旧版草稿；本机已有新版记录，未覆盖。';}
})();

let saveTimer=null;
function save(silent){store.updated_at=new Date().toISOString();
  try{localStorage.setItem(V2_KEY,JSON.stringify(store));
    if(!silent){$('saveState')&&setSaveState('草稿已自动保存 '+new Date().toLocaleTimeString());}}
  catch(e){const s=$('saveState');if(s){s.textContent='本机存储不可用，请使用导出 JSON 保存。';s.className='err'}}}
function autosave(){clearTimeout(saveTimer);setSaveState('正在保存…');saveTimer=setTimeout(()=>save(false),450)}
function setSaveState(msg){const s=$('saveState');if(s){s.textContent=msg;s.className=''}}

/* ================= header / sidebar ================= */
let current=D.tasks[0], step=1, aux='review', selectedEv=null;
$('reviewer').value=store.reviewer;
$('reviewer').addEventListener('input',()=>{store.reviewer=$('reviewer').value;autosave()});

function renderSidebar(){
  const list=$('taskList');list.replaceChildren();let done=0;
  for(const t of D.tasks){const r=store.tasks[t.id];if(r&&r.step3.decision)done++;
    if($('track').value!=='全部 Track'&&$('track').value!==t.track)continue;
    const [st,cls]=taskStatus(t);
    if($('statusFilter').value!=='全部状态'&&$('statusFilter').value!==st)continue;
    if($('search').value&&!t.question.includes($('search').value))continue;
    const b=el('button',undefined,'taskCard'+(t===current?' active':''));
    const row1=el('div',undefined,'row1');
    row1.append(el('span',t.track,'tk '+t.track),el('span','查询 '+fmtT(t.query_time),'muted small'),el('span',st,'st '+cls));
    const dots=el('span',undefined,'dots');
    dots.append(el('i',undefined,r&&r.step1.locked?'on':''),el('i',undefined,r&&r.step2.note?'on':''),el('i',undefined,r&&r.step3.decision?'on':''));
    row1.append(dots);
    b.append(row1,el('div',t.qtext||t.question,'q'));
    b.addEventListener('click',()=>selectTask(t));list.append(b);}
  $('progress').textContent=`已审 ${done} / ${D.tasks.length}`;}
['track','statusFilter'].forEach(id=>$(id).addEventListener('change',renderSidebar));
$('search').addEventListener('input',renderSidebar);

/* ================= task selection ================= */
function selectTask(t){
  current=t;step=1;aux='review';selectedEv=null;
  stopVideo('winVideo');stopVideo('evVideo');
  renderSidebar();renderAuxTabs();render();
}
function stopVideo(id){const v=$(id);if(v){v.pause();v.removeAttribute('src');v.load()}}

/* ================= stepper ================= */
function renderStepbar(){
  const r=rec(current);
  [['stepBtn1',1],['stepBtn2',2],['stepBtn3',3]].forEach(([id,n])=>{
    const b=$(id);b.className='step'+(step===n?' active':'')+(n===1&&r.step1.locked?' locked-step':'')+(n===3&&r.step3.decision?' done':'');
    b.disabled=(n===2||n===3)&&!r.step1.locked;
    if(n===1)b.querySelector('.n').textContent=r.step1.locked?'✓':'1';
    if(n===3)b.querySelector('.n').textContent=r.step3.decision?'✓':'3';});
}
$('stepBtn1').onclick=()=>{step=1;render()};
$('stepBtn2').onclick=()=>{if(rec(current).step1.locked){step=2;render()}};
$('stepBtn3').onclick=()=>{if(rec(current).step1.locked){step=3;render()}};

/* ================= video helpers ================= */
function bindVideo(id,msgId){
  const v=$(id),msg=$(msgId);
  v.addEventListener('error',()=>{if(!v.getAttribute('src'))return;
    msg.className='vmsg err';msg.textContent='视频加载失败：请保持本页与项目目录的相对位置，或在项目根目录运行 python -m http.server 8000 后访问。'});
  v.addEventListener('timeupdate',()=>{const c=$(id+'Clock');if(c)c.textContent=v.currentTime.toFixed(3)+'s / '+(v.duration?v.duration.toFixed(3):'—')+'s'});
  return v;}
function clampTo(v,hi,msgEl,label){
  v.ontimeupdate=()=>{
    const c=$(v.id+'Clock');if(c)c.textContent=v.currentTime.toFixed(3)+'s';
    if(v.currentTime>hi+0.02){v.pause();
      try{v.currentTime=hi}catch(e){}
      if(msgEl){msgEl.className='vmsg warn';msgEl.textContent=`已到${label}上限 ${fmtT(hi)}，播放停止（正式审核不允许播放未来帧）。`;}}};}
function vctlHtml(prefix){const d=el('div');d.innerHTML=`
  <div class="vctl">
    <button data-act="start">⟪ 起点</button><button data-act="end">查询时刻 ⟫</button>
    <button data-act="back" title="后退 1/30 秒">−1/30s</button><button data-act="fwd" title="前进 1/30 秒">+1/30s</button>
    <select data-act="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <span class="clock" id="${prefix}Clock">0.000s</span>
  </div><p class="vmsg" id="${prefix}Msg" role="status"></p>`;return d;}
function wireVctl(root,v,getRange){
  root.querySelectorAll('[data-act]').forEach(c=>{const act=c.dataset.act;
    if(act==='speed'){c.onchange=()=>v.playbackRate=Number(c.value);return}
    c.onclick=()=>{const[lo,hi]=getRange();const m=root.querySelector('.vmsg');
      if(act==='start')v.currentTime=lo;
      if(act==='end')v.currentTime=hi;
      if(act==='back'||act==='fwd'){v.pause();const t=v.currentTime+(act==='fwd'?1/30:-1/30);
        v.currentTime=Math.min(hi,Math.max(lo,t));
        if(m&&t>hi){m.className='vmsg warn';m.textContent='已到查询时刻，不能前进。'}}};});}

/* ================= evidence resolution ================= */
function taskEvidence(t){
  const items=[{kind:'current',ref:t.current_evidence.find(r=>r.endsWith('_current')),title:'当前窗口',src:'VIDEO'}];
  for(const ref of t.history_evidence){
    const e=E.get(ref);
    if(!e){items.push({kind:'missing',ref,title:'证据缺失',src:'AI_CANDIDATE'});continue}
    if(e.source_id==='src:video'){const seg=TL.get(ref);
      items.push({kind:'video',ref,title:seg?seg.key:ref.split(':').pop(),src:'VIDEO',seg,e});
    }else items.push({kind:'text',ref,e,title:e.source_label,src:'ANNOTATION_TEXT'});}
  for(const ref of t.annotation_evidence){const e=E.get(ref);
    items.push(e?{kind:'text',ref,e,title:e.source_label,src:'ANNOTATION_TEXT'}
                :{kind:'missing',ref,title:'证据缺失',src:'ANNOTATION_TEXT'});}
  return items;}

function evItemButton(it){
  const b=el('button',undefined,'evItem'+(selectedEv&&selectedEv.ref===it.ref&&selectedEv.kind===it.kind?' active':''));
  const label=it.kind==='current'?'当前窗口（查询前）':it.kind==='video'?`${it.seg.start}–${it.seg.end}s · ${it.title}`:
    it.kind==='text'?`${fmtT(it.e.interval.start)} · ${it.title}`:`${it.ref} 缺失`;
  const tag=it.kind==='current'?'AI_CANDIDATE':it.kind==='video'?'AI_CANDIDATE':it.src;

           el('span',label,'t'));

function evRangeOf(it,t){
  if(!it)return()=>[0,0];
  if(it.kind==='current')return()=>[0,t.query_time];
  if(it.kind==='video'&&it.e)return()=>[0,Math.min(it.e.interval.end,t.query_time)-it.e.interval.start];
  return()=>[0,0];}
function renderEvPane(box,it,t){
  box.replaceChildren(el('div','证据查看','panelTitle'));
  if(!it)return;
  if(it.kind==='missing'){box.append(el('p',`证据缺失：${it.ref} 未在证据索引中找到，请在导出备注中说明。`,'vmsg err'));return}
  const head=el('div',undefined,'evHead');
  const tag=it.kind==='text'?'ANNOTATION_TEXT':(it.kind==='current'?'AI_CANDIDATE · VIDEO':'VIDEO');
  head.append(el('span',tag,'src '+(it.kind==='text'?'ANNOTATION_TEXT':'VIDEO')));
  if(it.kind==='current')head.append(el('strong',`当前窗口 · 0–${fmtT(t.query_time)}（片段零点 = ${fmtT(t.window_start)}）`));
  if(it.kind==='video'&&it.e)head.append(el('strong',`${it.e.interval.start}–${it.e.interval.end}s · ${keyOf(it.ref)}`));
  if(it.kind==='text')head.append(el('strong',`${fmtT(it.e.interval.start)} · ${it.e.source_label}`));
  box.append(head);
  if(it.kind==='text'){
    const card=el('div',undefined,'quoteCard');
    card.append(el('div','“'+it.e.quote+'”','q'),
      el('div',`${it.e.source_pointer} · 点为锚时间，非动作完成时间；真实语音未核验，不得默认其内容成立。`,'muted small'));
    box.append(card);return;}
  const vp=el('div',undefined,'videoPane');
  const v=el('video');v.id='evVideo';v.controls=true;v.preload='metadata';
  let clip,lo,hi;
  if(it.kind==='current'){clip=TASK_CLIP(t);lo=0;hi=t.query_time-t.window_start;
    vp.append(el('div','当前窗口（与左侧一致，仅允许查询前画面）','panelTitle'));}
  else{const seg=it.seg;clip=seg.clip;lo=0;hi=Math.min(it.e.interval.end,t.query_time)-it.e.interval.start;
    vp.append(el('div',`片段 · 绝对时间 ${it.e.interval.start}–${it.e.interval.end}s（片段零点相对起点）`,'panelTitle'));}
  const iv=it.e?it.e.interval:{start:t.window_start,end:t.query_time};
  if(iv.start>=t.query_time){
    box.append(el('p','该证据起点晚于查询时刻，不能用于本任务的正式核验。','vmsg err'));return;}
  if(iv.end>t.query_time){const w=el('p',`该证据超出查询时刻，正式核验已截断至 ${fmtT(t.query_time)}。`,'vmsg warn');box.append(w);}
  v.src=clip;vp.append(v,vctlHtml('evVideo'));
  if(it.seg){const seg=it.seg;if(seg.observation)vp.append(el('p',`AI 观察（候选，非结论）：${seg.observation}`,'muted small'));
    if(seg.uncertainty)vp.append(el('p',`局限：${seg.uncertainty}`,'muted small'));
    const strip=el('div',undefined,'frameStrip');
    const fr=seg.frames,idx=[...new Set([0,Math.floor(fr.length/2),fr.length-1])];
    for(const i of idx){const f=fr[i];if(!f)continue;const fig=el('figure');
      const img=el('img');img.src=f.path;img.loading='lazy';img.alt='解码帧 '+f.pts_seconds+'s';
      img.onerror=()=>{fig.replaceChildren(el('small',`帧图缺失 ${f.path}`))};
      fig.append(img,el('figcaption',fmtT(f.pts_seconds),'muted small'));strip.append(fig);}
    vp.append(strip);}
  box.append(vp);
}

  if(aux!=='review'){renderAux();return}
  if(step===1)renderStep1();else if(step===2)renderStep2();else renderStep3();}

/* ================= export / import ================= */
$('exportBtn').onclick=()=>{save(true);
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=el('a');a.href=url;
  a.download='GX010021_review_v2_drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let data;try{data=JSON.parse(rd.result)}catch(e){alert('导入失败：不是有效 JSON。');return}
    let n=0;
    const srcTasks=data.tasks||data.drafts||data;
    const legacyMode=!data.format_version;
    for(const t of D.tasks){const inc=srcTasks[t.id];if(!inc)continue;const r=rec(t);n++;
      if(legacyMode){if(inc.notes)r.step3.notes=inc.notes;if(inc.reviewer&&!store.reviewer)store.reviewer=inc.reviewer;continue}
      for(const grp of['step1','step2','step3'])if(inc[grp])for(const[k,v]of Object.entries(inc[grp]))if(v!==''&&v!==null&&v!==undefined)r[grp][k]=v;
      if(inc.saved_at&&(!r.saved_at||inc.saved_at>r.saved_at))r.saved_at=inc.saved_at;}
    if(data.reviewer&&!store.reviewer)store.reviewer=data.reviewer;
    save(true);$('reviewer').value=store.reviewer;
    alert(`导入完成：合并 ${n} 条任务记录${legacyMode?'（旧版草稿格式，已迁移备注与署名）':''}。`);
    renderSidebar();render();};
  rd.readAsText(f,'utf-8');ev.target.value='';});

/* ================= init ================= */
renderSidebar();render();
</script>
</body>
</html>
